# ASTRA — Prototype configuration
# Every tunable that affects demo behavior lives here, not scattered through
# code, so a judge-facing tweak (thresholds, camera index, feature flags)
# never means editing Python.

# --- Camera / video input ---
camera:
  # source: "webcam" | "video_file" | "synthetic"
  #   webcam     -> live OpenCV VideoCapture(camera_index)
  #   video_file -> plays back a recorded clip (Demo Mode)
  #   synthetic  -> procedurally generated test clip (used for headless dev/testing)
  source: synthetic
  camera_index: 0
  frame_width: 1280
  frame_height: 720
  target_fps: 30
  video_file_path: "data/recordings/demo_clip.mp4"

# --- Perception thresholds ---
perception:
  confidence_threshold: 0.60      # below this -> "Analyzing..." not a verdict
  # hand_object_distance_px/hand_object_touch_distance_px are calibrated
  # against a 640px-wide reference frame (backend/perception/interaction.py
  # scales them to whatever the camera's *actual* capture width turns out
  # to be — observed differing from config.yaml's requested resolution).
  # Real-world debug readout showed genuine touching hands 150-330px apart
  # at an actual 1920px-wide capture (palm-center landmark approximation is
  # noisy, not exact contact); these values (scaled x3 at 1920px ->
  # 450/780px) give generous margin above that observed range.
  hand_object_distance_px: 260    # HAND_APPROACHING_OBJECT threshold, at 640px reference width
  hand_object_touch_distance_px: 150  # HAND_TOUCHING_OBJECT threshold, at 640px reference width
  min_box_contour_area: 800       # ignore color-noise smaller than this

  # Legacy v1 single-area field — ColorBoxDetector always emits it, but
  # v2.0's placement logic uses target_zones (below) instead. Zeroed out so
  # it doesn't draw a third, unused dashed box over zone_a/zone_b.
  experiment_area: [0.0, 0.0, 0.0, 0.0]

  # HSV thresholds for the color-based box detector (Phase 2, reused here
  # instead of YOLO — see detector_backend below). THESE ARE STARTING
  # POINTS, NOT TUNED AGAINST A REAL ROOM. Lighting varies a lot — if
  # detection is unreliable on your actual boxes, run
  # `python tools/calibrate_hsv.py` to find better ranges interactively and
  # paste the results back in here. Black is brightness-based (low V), so
  # it's far more sensitive to lighting than hue-based red — calibrating
  # for your actual room is expected, not optional. White was dropped: a
  # white object against a white table isn't separable by HSV at all (same
  # low-saturation/high-value signature as the background).
  colors:
    black_box:
      ranges:
        - lower: [0, 0, 0]
          upper: [180, 255, 60]
    red_box:
      ranges:
        - lower: [0, 120, 70]
          upper: [10, 255, 255]
        - lower: [170, 120, 70]
          upper: [180, 255, 255]

  # --- v2.0: general object detection ---
  # "hsv" tracks the color-defined boxes above (black_box/red_box) — no
  # training, same approach v1.0 uses. "yolo" recognizes real
  # object identity (phone, cup, bottle, ...) via a pretrained model instead
  # — no color markers needed, but MediaPipe hand-tracking noise made
  # touch/place detection unreliable enough in practice that this demo
  # reverted to the color-box path; kept available for future use.
  detector_backend: hsv
  yolo_model: yolov8n.pt          # downloads once on first use, cached after
  yolo_confidence_threshold: 0.35
  yolo_imgsz: 320                  # lower = faster on CPU, less accurate on small/distant objects
  yolo_classes:                    # COCO class names to track (exact names YOLO uses)
    - cup
    - bottle

  # --- v2.0: multiple named placement zones (fraction-of-frame [x1,y1,x2,y2]) ---
  # Each ExperimentStep.target names one of these keys (case-insensitive) —
  # e.g. v2_general_objects.json's step 2 targets "ZONE_A". Calibrated
  # regions, not detected — same reasoning as v1's single experiment_area.
  target_zones:
    zone_a: [0.05, 0.55, 0.35, 0.85]
    zone_b: [0.65, 0.55, 0.95, 0.85]

# --- Temporal smoothing / hysteresis (used from Phase 4/6 onward) ---
temporal:
  action_stability_frames: 6      # a prediction must hold for N frames to count
  min_confidence_duration_ms: 300

# --- Feature flags ---
features:
  enable_voice: true
  enable_recording: true
  enable_streaming: false         # optional IP/MJPEG stream, off by default
  demo_mode: true                 # true while camera.source != "webcam"
  use_mock_engines: false         # true -> scripted Phase 0/1 mocks instead of real perception/action (headless/CI)

# --- Inference device ---
# auto -> use CUDA if a compatible model/runtime reports it available, else CPU.
# MVP perception (MediaPipe) runs on CPU regardless; this flag matters once a
# trained detector is swapped in during the training-pipeline phase.
model_device: auto

# --- Paths ---
paths:
  experiment_config: "experiments/v2_general_objects.json"
  recordings_dir: "data/recordings"
  reports_dir: "data/reports"
  raw_data_dir: "data/raw"

# --- Backend server ---
server:
  host: "0.0.0.0"
  port: 8000
